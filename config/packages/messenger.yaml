framework:
    messenger:
        failure_transport: failed
        # In messenger.yaml, the messages sent to each transport - async and async_priority_high -
        # need to ultimately be delivered into two different queues
        # so that we can consume them independently.
        # And we've accomplished that!
        # But there are two different ways
        # that we could have done this.
        transports:
            # https://symfony.com/doc/current/messenger.html#transports
            # First, remember that in AMQP, messages are sent to an exchange, not a queue.
            # Right now, when a message is routed to the async transport,
            # Messenger sends that to an exchange called messages.
            # You don't see that config here only because messages is the default exchange name in Messenger.
            async:
                # Let's refactor our transports to use this "smarter" system.
                # Under the async transport,
                # add options,
                # then exchange,
                # and set name to messages.
                options:
                    exchange:
                        name: messages
                        # If we stopped here, this would change nothing:
                        # this is the default exchange name in Messenger.
                        # But now, add a type key set to direct.
                        # This does change things:
                        # the default value is fanout.
                        # Add one more key below this: default_publish_routing_key set to normal.
                        # I'll talk about that in a second.
                        type: direct
                        default_publish_routing_key: normal
                    queues:
                    # Next, add a queues section.
                    # Let's "bind" this exchange to a queue called messages_normal.
                    # But we won't stop there!
                    # Under this, add binding_keys set to [normal].
                    # That word normal could be any string.
                    # But it's no accident that this matches
                    # what we set for default_publish_routing_key.
                        messages_normal:
                            binding_keys: [normal]
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    delay: 500
            # When a message is routed to the async_priority_high transport,
            # Messenger sends that to an exchange called messages_high_priority.
            # Each transport always sends to exactly one exchange.
            # Then, each exchange routes every message to a single queue,
            # like the messages exchange sends to a messages queue
            # and messages_high_priority exchange sends to a messages_high queue.
            # There is not a routing key on the binding:
            # Messenger binds each exchange to one queue, but with no routing key.
            # That's how a "fanout" exchange works:
            # it doesn't care about routing keys,
            # it just sends each message to every queue bound to it.
            async_priority_high:
                # In config/packages/messenger.yaml, we're referencing this environment variable for both the async and async_priority_high transports.
                # We've been storing messages in a database table.
                # It was quick to set up, easy to use,
                # - because we already understand databases - and robust enough for most use-cases.
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    # in config/packages/messenger.yaml we created two transport
                    # - async & async_priority_high -
                    # and we route different messages to each.
                    # We did this so that, when we run our worker,
                    # we can tell it to always read messages from async_priority_high first before reading messages from async.
                    # That makes async_priority_high a place for us to send "higher" priority messages.
                    # The idea behind our async and async_priority_high transports was
                    # that we can send some messages to async_priority_high and others to async,
                    # with the goal that those messages would end up in different "buckets" or, more technically, in different "queues".
                    # Then we can instruct our worker to first read all messages from whatever queue async_priority_high is bound to
                    # before reading messages from whatever queue the async transport is bound to.
                    # This did work before with Doctrine,
                    # thanks to this queue_name: high option.
                    # The default value for this option is default.
                    # Let's configure this inside of messenger.yaml.
                    # Under options add exchange then name set to, how about, messages_high_priority.
                    # Below this, add queues with just one key below: messages_high set to null.
                    # Let's repeat the new exchange setup for the async_priority_high transport:
                    # we want this to deliver to the same direct exchange,
                    # but then use a different routing key to route messages to a different queue.
                    # Change the exchange to messages,
                    # set the type to direct,
                    # then use default_publish_routing_key
                    # to automatically attach a routing key called high to each message.
                    # Below, for the messages_high queue, this tells Messenger
                    # that we want this queue to be created and bound to the exchange.
                    # That's cool, but we now need that binding to have a routing key.
                    # Set binding_keys to [high].
                    exchange:
                        name: messages
                        type: direct
                        default_publish_routing_key: high
                    queues:
                        messages_high:
                            binding_keys: [high]
                        # This config has three effects.
                        # First, because we have the auto_setup feature enabled,
                        # the first time we talk to RabbitMQ,
                        # Messenger will create the messages_high_priority exchange,
                        # the messages_high queue and bind them together.
                        # The second effect is that
                        # when we send messages to this transport,
                        # they will be sent to the messages_high_priority exchange.
                        # The third and final effect is that
                        # when we consume from this transport,
                        # Messenger will read messages from the messages_high queue.
            # Oh, but notice that I am still using doctrine for my failure transport
            # and I'm going to keep that.
            # The failure transport is a special type of transport
            # and it turns out that the doctrine transport type actually has the most features for reviewing failed messages.
            # You can use AMQP for this, but I recommend Doctrine.
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # Route your messages to the transports
            # Start in messenger.yaml:
            # we're referencing AddPonkaToImage.
            # Add Command to that class name.
            'App\Message\Command\AddPonkaToImage': async_priority_high

            # In fact, unlike with commands, when we dispatch an event,
            # we don't actually care if there are any handlers for it.
            # There could be zero, 5, 10 - we don't care!
            # We're not going to use any return values from the handlers
            # and, unlike with commands, we're not going to expect that anything specific happened.
            # You're just screaming out into space: “Hey! An ImagePost was deleted!”
            # Anyways, the last piece we need to fix to make this truly identical to before
            # is, in config/packages/messenger.yaml, down under routing,
            # route App\Message\Event\ImagePostDeletedEvent to the async transport.

            # When you route a command class,
            # you know exactly which one handler it has.
            # And so, it's super easy to think about what
            # that handler does and determine whether or not it can be handled async.
            # With events, it's a bit more complicated:
            # this one event class could have multiple handlers.
            # And, in theory, you might want some to be handled immediately and others later.
            # Because Messenger is built around routing the messages to transports - not the handlers -
            # making some handlers sync and others async isn't natural.
            # However, if you need to do this, it is possible:
            # you can route a message to multiple transports,
            # then configure Messenger to only
            # call one handler when it's received from transport A
            # and only the other handler when it's received from transport B.
            'App\Message\Event\ImagePostDeletedEvent': async
            # then temporarily route this class to that transport in messenger.yaml
            # Let's comment that out and remove the routing config.

#Next, to get a clean start: remove the DeletePhotoFile command class itself and DeletePhotoFileHandler.
#Finally, in config/packages/messenger.yaml, we're routing the command we just deleted.
#Comment that out.
#            'App\Message\DeletePhotoFile': async
#Let's look at this with fresh eyes.
#We've successfully made DeleteImagePostHandler perform its primary job only: deleting the ImagePost.
#And now we're wondering: where should I put the code to do the secondary task of deleting the physical file?
#We could put that logic right here, or leverage an event.

    #Before we create our first event,
    #I'll open config/packages/messenger.yaml.
    #If our app leverages both commands and events,
    #it's totally ok to use just one bus to handle all of that.
    #But, in the interest of learning more,
    #let's continue to use our existing bus only as a command bus
    #and create a new bus to only use with events.
    #To do that, under the "buses:" key, add a new one called "event.bus".
    #Set this to "~"" which is null,  just because we don't have any other configuration
    #that we need to put here yet.
    #This will cause a new MessageBus service to be added to the container.
        # Copy the name of the default bus.
        # Once you define more than one bus,
        # you need a default_bus key set to your "main" bus.
        # This tells Symfony
        # which MessageBus service to pass us
        # when we use the MessageBusInterface type-hint.
        default_bus: command.bus
        buses:
            # Oh, but while we're cleaning things up,
            # back in config/packages/messenger.yaml,
            # our main bus is called messenger.bus.default,
            # which becomes the bus's service id in the container.
            # We used this name just because that's the default value Symfony uses
            # when you have only one bus.
            # But because this is a command bus, let's call it that!
            # Rename it to command.bus.
            # And above, use that as our default_bus.
            command.bus:
                middleware:
                    - App\Messenger\AuditMiddleware
            # In messenger.yaml, take the ~ off of event.bus and add a new option below:
            # default_middleware: allow_no_handlers.
            # The default_middleware option defaults to true
            # and its main purpose is to allow you to set it to false if, for some reason,
            # you wanted to completely remove the default middleware -
            # the middleware that handle & send the messages, among other things.
            # But you can also set it to allow_no_handlers
            # if you want to keep the normal middleware,
            # but hint to the HandleMessageMiddleware that it should not panic if there are zero handlers.
            event.bus:
                # Oh, and this AuditMiddleware is something that we really should also use on event.bus:
                # it logs the journey of messages
                # which is equally valid here.
                middleware:
                    - App\Messenger\AuditMiddleware
                default_middleware: allow_no_handlers
            # Go back and restart the worker.
            # Then, delete another image come back here and it works!
            # It says "No handler for message" but it doesn't freak out and cause a failure.
            # 16:09:22 INFO [messenger] Received message App\Message\Event\ImagePostDeletedEvent ["message" => App\Message\Event\ImagePostDeletedEvent^ { …},"class" => "App\Message\Event\ImagePostDeletedEvent"]
            # 16:09:22 INFO [messenger] No handler for message App\Message\Event\ImagePostDeletedEvent ["message" => App\Message\Event\ImagePostDeletedEvent^ { …},"class" => "App\Message\Event\ImagePostDeletedEvent"]
            # 16:09:22 INFO [messenger] App\Message\Event\ImagePostDeletedEvent was handled successfully (acknowledging to transport). ["message" => App\Message\Event\ImagePostDeletedEvent^ { …},"class" => "App\Message\Event\ImagePostDeletedEvent"]
            # So now our command bus and event bus do have a small difference
            # though they're still almost identical
            # and we could really still get away with sending both commands and events through the same bus.
            # In config/packages/messenger.yaml, we have command.bus and event.bus.
            # Let's add query.bus.
            # I'll keep things simple and just set this to ~ to get the default settings.
            query.bus: ~

