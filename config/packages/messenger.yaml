framework:
    messenger:
        failure_transport: failed
        transports:
            # https://symfony.com/doc/current/messenger.html#transports
            async:
                dsn: 'doctrine://default?queue_name=async'
                retry_strategy:
                    delay: 500
            async_priority_high:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: high
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # Route your messages to the transports
            # Start in messenger.yaml:
            # we're referencing AddPonkaToImage.
            # Add Command to that class name.
            'App\Message\Command\AddPonkaToImage': async_priority_high

            # In fact, unlike with commands, when we dispatch an event,
            # we don't actually care if there are any handlers for it.
            # There could be zero, 5, 10 - we don't care!
            # We're not going to use any return values from the handlers
            # and, unlike with commands, we're not going to expect that anything specific happened.
            # You're just screaming out into space: “Hey! An ImagePost was deleted!”
            # Anyways, the last piece we need to fix to make this truly identical to before
            # is, in config/packages/messenger.yaml, down under routing,
            # route App\Message\Event\ImagePostDeletedEvent to the async transport.

            # When you route a command class,
            # you know exactly which one handler it has.
            # And so, it's super easy to think about what
            # that handler does and determine whether or not it can be handled async.
            # With events, it's a bit more complicated:
            # this one event class could have multiple handlers.
            # And, in theory, you might want some to be handled immediately and others later.
            # Because Messenger is built around routing the messages to transports - not the handlers -
            # making some handlers sync and others async isn't natural.
            # However, if you need to do this, it is possible:
            # you can route a message to multiple transports,
            # then configure Messenger to only
            # call one handler when it's received from transport A
            # and only the other handler when it's received from transport B.
            'App\Message\Event\ImagePostDeletedEvent': async

#Next, to get a clean start: remove the DeletePhotoFile command class itself and DeletePhotoFileHandler.
#Finally, in config/packages/messenger.yaml, we're routing the command we just deleted.
#Comment that out.
#            'App\Message\DeletePhotoFile': async
#Let's look at this with fresh eyes.
#We've successfully made DeleteImagePostHandler perform its primary job only: deleting the ImagePost.
#And now we're wondering: where should I put the code to do the secondary task of deleting the physical file?
#We could put that logic right here, or leverage an event.

    #Before we create our first event,
    #I'll open config/packages/messenger.yaml.
    #If our app leverages both commands and events,
    #it's totally ok to use just one bus to handle all of that.
    #But, in the interest of learning more,
    #let's continue to use our existing bus only as a command bus
    #and create a new bus to only use with events.
    #To do that, under the "buses:" key, add a new one called "event.bus".
    #Set this to "~"" which is null,  just because we don't have any other configuration
    #that we need to put here yet.
    #This will cause a new MessageBus service to be added to the container.
        # Copy the name of the default bus.
        # Once you define more than one bus,
        # you need a default_bus key set to your "main" bus.
        # This tells Symfony
        # which MessageBus service to pass us
        # when we use the MessageBusInterface type-hint.
        default_bus: command.bus
        buses:
            # Oh, but while we're cleaning things up,
            # back in config/packages/messenger.yaml,
            # our main bus is called messenger.bus.default,
            # which becomes the bus's service id in the container.
            # We used this name just because that's the default value Symfony uses
            # when you have only one bus.
            # But because this is a command bus, let's call it that!
            # Rename it to command.bus.
            # And above, use that as our default_bus.
            command.bus:
                middleware:
                    - App\Messenger\AuditMiddleware
            # In messenger.yaml, take the ~ off of event.bus and add a new option below:
            # default_middleware: allow_no_handlers.
            # The default_middleware option defaults to true
            # and its main purpose is to allow you to set it to false if, for some reason,
            # you wanted to completely remove the default middleware -
            # the middleware that handle & send the messages, among other things.
            # But you can also set it to allow_no_handlers
            # if you want to keep the normal middleware,
            # but hint to the HandleMessageMiddleware that it should not panic if there are zero handlers.
            event.bus:
                # Oh, and this AuditMiddleware is something that we really should also use on event.bus:
                # it logs the journey of messages
                # which is equally valid here.
                middleware:
                    - App\Messenger\AuditMiddleware
                default_middleware: allow_no_handlers
            # Go back and restart the worker.
            # Then, delete another image come back here and it works!
            # It says "No handler for message" but it doesn't freak out and cause a failure.
            # 16:09:22 INFO [messenger] Received message App\Message\Event\ImagePostDeletedEvent ["message" => App\Message\Event\ImagePostDeletedEvent^ { …},"class" => "App\Message\Event\ImagePostDeletedEvent"]
            # 16:09:22 INFO [messenger] No handler for message App\Message\Event\ImagePostDeletedEvent ["message" => App\Message\Event\ImagePostDeletedEvent^ { …},"class" => "App\Message\Event\ImagePostDeletedEvent"]
            # 16:09:22 INFO [messenger] App\Message\Event\ImagePostDeletedEvent was handled successfully (acknowledging to transport). ["message" => App\Message\Event\ImagePostDeletedEvent^ { …},"class" => "App\Message\Event\ImagePostDeletedEvent"]
            # So now our command bus and event bus do have a small difference
            # though they're still almost identical
            # and we could really still get away with sending both commands and events through the same bus.
            # In config/packages/messenger.yaml, we have command.bus and event.bus.
            # Let's add query.bus.
            # I'll keep things simple and just set this to ~ to get the default settings.
            query.bus: ~

