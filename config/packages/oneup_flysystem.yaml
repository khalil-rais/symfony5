    #     Well, actually, it's an alias:
    #     I'll type 61 to view more info about it.
    #     Yep! This points to our public_uploads_filesystem service.
    #     The purpose of this is that it allows us to type-hint League\Flysystem\Filesystem and Symfony will autowire our filesystem service.
    #     If you only have 1 filesystem, having this alias is great.
    #     But if you have multiple, well, you can only autowire one of them.
    #     I'm going to remove the alias -
    #     I'll show you another way to access the filesystem service.
    #     Ok, config done!
